name: CI - Maven build

on: 
  push: 
  workflow_dispatch:

jobs:
  build:
     runs-on: ubuntu-latest

     
     steps:
       - name: Checkout repository
         uses: actions/checkout@v4

       - name: Set up JDK 11
         uses: actions/setup-java@v3
         with:
           java-version: '11'
           distribution: 'temurin'
             
       - name: Build with Maven
         run: mvn clean verify
